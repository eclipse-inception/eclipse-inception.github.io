<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eclipse INCEpTION</title>
<style>
  :root { color-scheme: dark; }
  html, body { overflow: clip; background: transparent; }
  body {
    margin: 0; color: #d9daf0;
    font: 16px/1.4 system-ui, sans-serif;
    transition: background-color 1s;
  }
  main { width: 100%; }

  .stage { container-type: inline-size; }
  .banner {
    --depth: 1500;
    position: relative; aspect-ratio: 957 / 209;
    perspective: calc(var(--depth) * 100cqw / 957);
    perspective-origin: 48.26% 50.4%;
    cursor: grab; touch-action: pan-y; user-select: none;
  }
  .banner.dragging { cursor: grabbing; }
  .bg, .letters { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .bg { transition: filter 1s; }
  body.night .bg { filter: brightness(.55) saturate(.8); }

  /* The board turns around the p's stem. */
  .word { position: absolute; inset: 0; transform-style: preserve-3d; transform-origin: 48.26% 50%; }
  .letters { overflow: visible; }

  .eclipse-word { visibility: hidden; filter: drop-shadow(0 0 3px #ff7a12) drop-shadow(0 0 9px #c43c00); }
  .tm { visibility: hidden; }
  body.night .eclipse-word, body.night .tm { visibility: visible; }

  .pumpkin {
    position: absolute; display: block; overflow: visible; visibility: hidden;
    left: 12.096%; top: 26.469%; width: 10.449%; height: 47.540%;
    transform: translateZ(1px) rotate(-8deg);
  }
  body.pumpkin-on .pumpkin { visibility: visible; }
  .candle { animation: candle 1.7s infinite; filter: drop-shadow(0 0 3px #ffb020); }
  @keyframes candle {
    0%, 100% { opacity: 1; } 18% { opacity: .78; } 31% { opacity: .96; } 47% { opacity: .68; }
    63% { opacity: 1; } 79% { opacity: .82; }
  }

  .moon {
    position: absolute; left: 0; top: 0; display: block; overflow: visible; visibility: hidden;
    width: 6.532%; height: 35.407%;
  }

  /* Fog stays inside the banner. */
  .fog { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity 3s; }
  body.night .fog { opacity: 1; }

  .logo-spot {
    position: absolute; right: 1.2%; bottom: 3%; width: 16.5%; padding: 1.2% 1.8%;
    box-sizing: content-box; pointer-events: none;
    opacity: 0; filter: blur(8px); transform: translateY(6px);
    background: radial-gradient(closest-side, rgba(214,219,238,.94) 48%, rgba(196,202,226,.6) 70%, rgba(170,178,208,.18) 88%, rgba(170,178,208,0));
  }
  .logo-spot svg { display: block; width: 100%; height: auto; }
  .logo-spot.up { opacity: 1; filter: none; transform: none; transition: opacity 6s ease-in, filter 7s ease-out, transform 7s ease-out; }

  /* Out of the way at the very bottom of the page. */
  .panel { position: fixed; left: .4rem; bottom: .4rem; z-index: 5; font-size: .8rem; }
  .panel label, .panel p { display: none; }
  #throw { padding: .1rem .45rem; opacity: .7; }
  #throw:disabled { visibility: hidden; }
  .controls { display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; align-items: end; }
  button {
    font: inherit; color: inherit; background: #2c2f80; border: 1px solid #5a5db0;
    border-radius: 6px; padding: .45rem .9rem; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #3a3e9c; }
  button:disabled { opacity: .5; cursor: default; }
  label { display: grid; gap: .25rem; font-size: .85rem; }
  label output { color: #9a9cd0; }
  input[type=range] { width: 11rem; accent-color: #8a8de0; }
  p { margin: 0; color: #9a9cd0; }

  .flash, .blackout, .bolt { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  .flash { z-index: 8; background: #e8ecff; }
  .bolt { z-index: 9; width: 100%; height: 100%; }
  .bolt path { fill: none; stroke: #fff; stroke-linejoin: bevel; filter: drop-shadow(0 0 6px #b9c6ff) drop-shadow(0 0 18px #7f93ff); }
  .blackout { z-index: 10; background: #000; }

  @media (prefers-reduced-motion: reduce) { .candle { animation: none; } }
</style>

            <path d="M24 116L44 131L53 121L64 139L75 126L84 143L92 128L100 143L109 126L120 139L131 121L140 131L160 116L150 150L130 161L119 148L107 170L97 153L92 174L87 153L77 170L65 148L54 161L34 150Z"/>

      </div>
      <svg class="moon" id="moon" viewBox="26.21 23.5 113.02 133.8" aria-hidden="true"><path fill="#F78D2C" d="M47.66,62.99c19.6-30.57,58.84-41.24,91.57-26.55c-0.72-0.5-1.45-1.01-2.2-1.49c-33.51-21.49-78.05-11.84-99.47,21.57c-21.43,33.4-11.62,77.91,21.89,99.4c0.75,0.48,1.51,0.93,2.27,1.38C34.73,133.68,28.06,93.56,47.66,62.99"/></svg>

</main>
<div class="panel">
  <div class="controls">
    <button id="throw" type="button" aria-label="Throw again" title="Throw again">&#8635;</button>
    <label>Impact strength <output id="flickOut"></output>
      <input id="flick" type="range" min="300" max="4000" step="50" value="1000"></label>
    <label>Friction <output id="frictionOut"></output>
      <input id="friction" type="range" min="0.25" max="3" step="0.05" value="1"></label>
    <label>Perspective depth <output id="depthOut"></output>
      <input id="depth" type="range" min="400" max="4000" step="50" value="1500"></label>
  </div>

  <p>Throw again once it has settled, or drag the word and let go to flick it yourself. Contains lightning and flickering light.</p>
</div>
<div class="flash" id="flash"></div>
<svg class="bolt" id="bolt" aria-hidden="true"><path id="boltMain"/><path id="boltFork"/></svg>
<div class="blackout" id="blackout"></div>

<script>
  const $ = id => document.getElementById(id);
  const banner = $('banner'), word = $('word'), moon = $('moon'), pumpkin = $('pumpkin'), throwButton = $('throw');
  // The lightning and the blackout cover the whole page around the banner.
  const host = (() => {
    try {
      return window.parent.document.body ? window.parent : window;
    } catch (e) {
      return window;
    }
  })();
  const flash = $('flash'), bolt = $('bolt'), blackout = $('blackout');
  const boltMain = $('boltMain'), boltFork = $('boltFork');
  const COVER = 'position:fixed;inset:0;pointer-events:none;opacity:0;z-index:2147483000;';
  flash.style.cssText = COVER + 'background:#e8ecff';
  bolt.style.cssText = COVER + 'width:100%;height:100%;z-index:2147483001';
  blackout.style.cssText = COVER + 'background:#000;z-index:2147483002';
  for (const path of [boltMain, boltFork]) {
    path.style.cssText = 'fill:none;stroke:#fff;stroke-linejoin:bevel;filter:drop-shadow(0 0 6px #b9c6ff) drop-shadow(0 0 18px #7f93ff)';
  }
  for (const [el, id] of [[flash, 'flash'], [bolt, 'bolt'], [blackout, 'blackout']]) {
    el.id = 'halloween-' + id;
    host.document.body.appendChild(el);
  }

  const LESS_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Banner geometry, in the units of the 957 wide viewBox.
  const UNITS = 957, AXIS_X = 461.86;
  const HIT_X = 240.7, HIT_Y = 105, MOON_W = 62.5, MOON_H = 74;

  // --- The board ------------------------------------------------------------
  let angle = 0, speed = 0, dragging = false;
  const CRAWL = 150, CATCH_RANGE = 50, SPRING = 30, DAMPING = 3.3;

  function stepBoard(dt) {
    const front = Math.round(angle / 360) * 360;
    const off = front - angle;
    if (Math.abs(speed) <= CRAWL && Math.abs(off) < CATCH_RANGE) {
      speed += (SPRING * off - DAMPING * speed) * dt;
    } else {
      const friction = +$('friction').value;
      const slowed = Math.abs(speed) - (220 + 0.25 * Math.abs(speed)) * friction * dt;
      speed = Math.sign(speed || 1) * Math.max(slowed, CRAWL);
    }
    angle += speed * dt;
    if (Math.abs(off) < 0.05 && Math.abs(speed) < 0.5) {
      angle = speed = 0;
      return false;
    }
    return true;
  }

  // --- The moon -------------------------------------------------------------
  // 'away', 'inbound' (before the hit) or 'outbound' (after it).
  let moonState = 'away', moonClock = 0, launchFrom = null, moonRoute = null;
  const INBOUND = 0.55, OUTBOUND = 2.0, WHIRL = 1000;

  function placeMoon(x, y, z, turn) {
    const px = banner.clientWidth / UNITS;
    moon.style.transform =
      `translate3d(${(x - MOON_W / 2) * px}px,${(y - MOON_H / 2) * px}px,${z * px}px) rotate(${turn}deg)`;
  }

  const screenLeft = () => -banner.getBoundingClientRect().left / (banner.clientWidth / UNITS);

  // It sets off just outside the window's left edge, close to the viewer, and
  // reaches the board moving inward: that is what gives the hit its turning force.
  function launchPoint() {
    const depth = +$('depth').value;
    const z = depth * 0.55;
    const nearScale = depth / (depth - z);
    const x = AXIS_X + (screenLeft() - MOON_W * nearScale - AXIS_X) / nearScale;
    return { x, y: HIT_Y + 95, z };
  }

  // After the hit it glances off, sweeps out to the right, comes round
  // above the banner and leaves the way it came.
  function outboundRoute() {
    return [
      [HIT_X, HIT_Y, 0], [HIT_X, HIT_Y, 0], [520, 10, 150], [850, 0, 70], [1010, 60, -110],
      [900, 20, -300], [430, 10, -220], [60, 25, 40], [-260, 40, 120], [-260, 40, 120],
    ];
  }

  // Catmull-Rom through the route's points.
  function along(route, t) {
    const spans = route.length - 3;
    const at = Math.min(t, 0.9999) * spans, i = Math.floor(at), f = at - i;
    const [p0, p1, p2, p3] = route.slice(i, i + 4);
    return p1.map((_, k) => 0.5 * (2 * p1[k] + (p2[k] - p0[k]) * f
      + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * f * f
      + (3 * p1[k] - p0[k] - 3 * p2[k] + p3[k]) * f * f * f));
  }

  function stepMoon(dt) {
    moonClock += dt;
    if (moonState === 'inbound') {
      const t = Math.min(moonClock / INBOUND, 1), left = 1 - t;
      placeMoon(HIT_X + (launchFrom.x - HIT_X) * left,
        HIT_Y + (launchFrom.y - HIT_Y) * left - 280 * t * left,
        launchFrom.z * left, WHIRL * moonClock);
      if (t === 1) {
        // Hitting the left arm pushes it away from the viewer.
        speed = -$('flick').value;
        sceneArmed = !isNight;
        moonRoute = outboundRoute();
        moonState = 'outbound';
        moonClock = 0;
      }
      return true;
    }
    if (moonState === 'outbound') {
      const t = moonClock / OUTBOUND;
      const [x, y, z] = along(moonRoute, t);
      placeMoon(x, y, z, WHIRL * (INBOUND + moonClock));
      if (t >= 1) {
        moonState = 'away';
        moon.style.visibility = 'hidden';
        return false;
      }
      return true;
    }
    return false;
  }

  function launch() {
    launchFrom = launchPoint();
    moonState = 'inbound';
    moonClock = 0;
    moon.style.visibility = 'visible';
    placeMoon(launchFrom.x, launchFrom.y, launchFrom.z, 0);
    run();
  }

  // --- The clock ------------------------------------------------------------
  let boardMoving = false, last = null;

  function tick(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    const moonMoving = stepMoon(dt);
    if (speed !== 0 || angle !== 0) boardMoving = !dragging && stepBoard(dt);
    else boardMoving = false;
    render();
    if (moonMoving || boardMoving) {
      requestAnimationFrame(tick);
    } else {
      last = null;
      updateButton();
      startSceneIfDue();
    }
  }

  function run() {
    updateButton();
    if (last === null) {
      last = performance.now();
      requestAnimationFrame(tick);
    }
  }

  function render() { word.style.transform = `rotateY(${angle}deg)`; }

  function updateButton() {
    throwButton.disabled = sceneRunning || clearing || moonState !== 'away' || speed !== 0 || angle !== 0;
  }

  let clearing = false;
  throwButton.addEventListener('click', async () => {
    clearing = true;
    updateButton();
    setNight(false);
    if (document.body.classList.contains('pumpkin-on')) {
      // Knock the pumpkin off before the next throw.
      await pumpkin.animate(
        [{ transform: 'translateZ(1px) rotate(-8deg)', opacity: 1 },
         { transform: 'translate(-10%, 170%) translateZ(1px) rotate(-90deg)', opacity: 0 }],
        { duration: 500, easing: 'ease-in' }).finished;
      document.body.classList.remove('pumpkin-on');
    }
    clearing = false;
    launch();
  });

  // --- Flicking by hand -----------------------------------------------------
  let dragX = 0, dragTime = 0;
  const DEG_PER_PX = 0.6;

  banner.addEventListener('pointerdown', e => {
    if (sceneRunning || clearing || moonState !== 'away') return;
    dragging = true;
    banner.classList.add('dragging');
    banner.setPointerCapture(e.pointerId);
    speed = 0;
    dragX = e.clientX;
    dragTime = e.timeStamp;
  });

  banner.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = (e.clientX - dragX) * DEG_PER_PX;
    const dt = (e.timeStamp - dragTime) / 1000;
    angle += dx;
    if (dt > 0) speed = 0.7 * speed + 0.3 * (dx / dt);
    dragX = e.clientX;
    dragTime = e.timeStamp;
    render();
    updateButton();
  });

  function release(e) {
    if (!dragging) return;
    dragging = false;
    banner.classList.remove('dragging');
    if (e.timeStamp - dragTime > 100) speed = 0;
    if (speed === 0 && angle === 0) { updateButton(); startSceneIfDue(); return; }
    run();
  }
  banner.addEventListener('pointerup', release);
  banner.addEventListener('pointercancel', release);

  // --- Settings -------------------------------------------------------------
  function showSettings() {
    $('flickOut').textContent = $('flick').value + ' °/s';
    $('frictionOut').textContent = '×' + (+$('friction').value).toFixed(2);
    $('depthOut').textContent = $('depth').value;
    banner.style.setProperty('--depth', $('depth').value);
  }
  for (const id of ['flick', 'friction', 'depth']) $(id).addEventListener('input', showSettings);
  showSettings();

  // --- Fog ------------------------------------------------------------------
  // One lumpy puff, drawn once and then only moved, turned and scaled.
  const puff = (() => {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const g = c.getContext('2d');
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * 6.283, d = Math.random() * 70;
      const x = 128 + Math.cos(a) * d, y = 128 + Math.sin(a) * d, r = 28 + Math.random() * 30;
      const grad = g.createRadialGradient(x, y, 0, x, y, r);
      grad.addColorStop(0, 'rgba(120,128,165,.17)');
      grad.addColorStop(1, 'rgba(120,128,165,0)');
      g.fillStyle = grad;
      g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    return c;
  })();

  function makeBank(canvas, count, opts) {
    const puffs = Array.from({ length: count }, () => ({
      x: Math.random() * 1.3 - 0.15,
      y: opts.top + Math.random() * (1.05 - opts.top),
      size: opts.size * (0.6 + Math.random() * 0.8),
      drift: (0.008 + Math.random() * 0.016) * (Math.random() < 0.5 ? -1 : 1),
      spin: (Math.random() - 0.5) * 0.55,
      phase: Math.random() * 6.283,
      alpha: opts.alpha * (0.5 + Math.random() * 0.5),
    }));
    return { canvas, g: canvas.getContext('2d'), puffs, thin: opts.thin };
  }
  const banks = [
    makeBank($('fogBack'), 34, { top: 0.1, size: 0.2, alpha: 0.8 }),
    makeBank($('fogFront'), 12, { top: 0.55, size: 0.16, alpha: 0.75, thin: true }),
  ];

  function sizeFog() {
    for (const b of banks) {
      b.canvas.width = Math.ceil(banner.clientWidth);
      b.canvas.height = Math.ceil(banner.clientHeight);
    }
  }
  addEventListener('resize', () => { sizeFog(); drawFog(fogClock); });
  sizeFog();

  let fogOn = false, fogClock = 0, fogLast = 0, frontFade = 1;

  function drawFog(t) {
    for (const b of banks) {
      const { width: w, height: h } = b.canvas;
      b.g.clearRect(0, 0, w, h);
      for (const p of b.puffs) {
        // Slow sideways drift; the rise, swell and roll are what make it wallow.
        const x = ((p.x + p.drift * t + 1.3 * 1000) % 1.3 - 0.15) * w;
        const y = (p.y + 0.1 * Math.sin(t * 0.42 + p.phase)) * h;
        const size = p.size * w * (1 + 0.25 * Math.sin(t * 0.36 + p.phase * 2));
        b.g.globalAlpha = p.alpha * (b.thin ? frontFade : 1) * (0.75 + 0.25 * Math.sin(t * 0.21 + p.phase));
        b.g.save();
        b.g.translate(x, y);
        b.g.rotate(p.phase + p.spin * t);
        b.g.drawImage(puff, -size / 2, -size / 2, size, size);
        b.g.restore();
      }
    }
  }

  function fogFrame(now) {
    if (!fogOn) return;
    fogClock += Math.min((now - fogLast) / 1000, 0.05);
    fogLast = now;
    drawFog(fogClock);
    requestAnimationFrame(fogFrame);
  }

  // --- The scene: lightning, lights out, lights back on ---------------------
  let isNight = false, sceneArmed = false, sceneRunning = false;
  const pause = ms => new Promise(done => setTimeout(done, ms));

  function setNight(on) {
    isNight = on;
    document.body.classList.toggle('night', on);
    if (!on) {
      $('logoSpot').classList.remove('up');
      fogOn = false;
      return;
    }
    frontFade = LESS_MOTION ? 0.25 : 1;
    if (LESS_MOTION) {
      drawFog(fogClock);
    } else if (!fogOn) {
      fogOn = true;
      fogLast = performance.now();
      requestAnimationFrame(fogFrame);
    }
  }

  // A jagged line from (x0,y0) to (x1,y1) by repeatedly displacing midpoints.
  function jagged(x0, y0, x1, y1, roughness) {
    let pts = [[x0, y0], [x1, y1]];
    for (let spread = roughness; spread > 3; spread *= 0.55) {
      const next = [pts[0]];
      for (let i = 1; i < pts.length; i++) {
        const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
        next.push([(ax + bx) / 2 + (Math.random() - 0.5) * spread, (ay + by) / 2 + (Math.random() - 0.5) * spread * 0.3], pts[i]);
      }
      pts = next;
    }
    return pts;
  }
  const toPath = pts => 'M' + pts.map(p => p.map(n => n.toFixed(1)).join(' ')).join('L');

  function drawBolt() {
    // It strikes the spot where the pumpkin is about to be.
    const r = pumpkin.getBoundingClientRect();
    const frame = host === window ? { left: 0, top: 0 } : window.frameElement.getBoundingClientRect();
    const tx = frame.left + r.left + r.width / 2, ty = frame.top + r.top + r.height / 2;
    const innerWidth = host.innerWidth, innerHeight = host.innerHeight;
    const main = jagged(tx + innerWidth * 0.16, -10, tx, ty, Math.max(innerHeight * 0.32, 60));
    const from = main[Math.floor(main.length * 0.4)];
    const fork = jagged(from[0], from[1], from[0] + innerWidth * 0.11, from[1] + innerHeight * 0.3, innerHeight * 0.14);
    boltMain.setAttribute('d', toPath(main));
    boltMain.setAttribute('stroke-width', 4);
    boltFork.setAttribute('d', toPath(fork));
    boltFork.setAttribute('stroke-width', 2);
  }

  const play = (el, opacities, ms) => el.animate(
    opacities.map(opacity => ({ opacity })), { duration: ms, easing: 'linear', fill: 'forwards' }).finished;

  function becomeNight() {
    document.body.classList.add('pumpkin-on');
    setNight(true);
  }

  async function runScene() {
    sceneRunning = true;
    updateButton();
    await pause(350);

    // Two strikes, well under three flashes in any second.
    drawBolt();
    play(bolt, [0, 1, 1, .15, 0, 0, 1, 1, .3, 0], 1800);
    await play(flash, [0, .7, .25, 0, 0, 0, .5, .2, 0, 0], 1800);
    await pause(400);

    // The lights struggle, then die: slow, shallow dips.
    await play(blackout, [0, .1, .6, .6, .3, .3, .75, .75, .55, .75, 1], 3000);

    becomeNight();
    await pause(900);

    await play(blackout, [1, 1, .6, .75, .75, .35, .35, .5, .2, 0], 2400);

    $('logoSpot').classList.add('up');
    const started = performance.now();
    while (frontFade > 0.25) {
      await pause(100);
      frontFade = Math.max(0.25, 1 - (performance.now() - started) / 8000);
    }
    sceneRunning = false;
    updateButton();
  }

  function startSceneIfDue() {
    if (!sceneArmed || dragging || moonState !== 'away' || speed !== 0 || angle !== 0) return;
    sceneArmed = false;
    if (LESS_MOTION) {
      // No lightning and no flicker: it is simply night.
      becomeNight();
      $('logoSpot').classList.add('up');
      return;
    }
    runScene();
  }

  // Throw on load. If the viewer asked for less motion, it is simply already night.
  // The same goes for a visitor who has already seen it in this session.
  let seen = false;
  try {
    seen = sessionStorage.getItem('halloween-seen') !== null;
    sessionStorage.setItem('halloween-seen', '1');
  } catch (e) {
    // No session storage: it just plays every time.
  }
  if (LESS_MOTION || seen) {
    becomeNight();
    frontFade = 0.25;
    $('logoSpot').classList.add('up');
  } else {
    setTimeout(launch, 700);
  }
</script>
</body>
